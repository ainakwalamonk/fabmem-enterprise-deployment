# Azure DevOps equivalent of ci/github/fabmem-index.yml. Same contract: build, archive the CONTENTS, upload,
# presign, POST a pointer to /ingest/build.
#
# Variables required (mark the key secret):
#   FABMEM_URL          https://fabmem.yourcompany.com
#   FABMEM_INGEST_KEY   an `ingest` key issued from the dashboard's API keys page   [secret]
#   FABMEM_SPHERE       the sphere id (or name) from the dashboard's Spheres page
#   AZURE_STORAGE_ACCOUNT / FABMEM_ARTIFACT_CONTAINER   where the archive is staged
trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'

  - script: npm ci && npm run build
    displayName: Build the workspace

  # Contents, not the directory — see the note in the GitHub workflow.
  - script: tar czf $(Agent.TempDirectory)/build.tgz --exclude='.git' .
    displayName: Archive the built workspace

  - task: AzureCLI@2
    displayName: Upload and generate a SAS URL
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        BLOB="$(Build.SourceVersion).tgz"
        az storage blob upload --account-name "$AZURE_STORAGE_ACCOUNT" \
          --container-name "$FABMEM_ARTIFACT_CONTAINER" --name "$BLOB" \
          --file "$(Agent.TempDirectory)/build.tgz" --overwrite --auth-mode login
        EXPIRY=$(date -u -d '+1 hour' '+%Y-%m-%dT%H:%MZ')
        SAS=$(az storage blob generate-sas --account-name "$AZURE_STORAGE_ACCOUNT" \
          --container-name "$FABMEM_ARTIFACT_CONTAINER" --name "$BLOB" \
          --permissions r --expiry "$EXPIRY" --https-only --as-user --auth-mode login -o tsv)
        echo "##vso[task.setvariable variable=ARTIFACT_URL;issecret=true]https://$AZURE_STORAGE_ACCOUNT.blob.core.windows.net/$FABMEM_ARTIFACT_CONTAINER/$BLOB?$SAS"

  - script: |
      set -euo pipefail
      RESP=$(curl -fsS -X POST "$FABMEM_URL/ingest/build?sphere=$FABMEM_SPHERE" \
        -H "authorization: Bearer $FABMEM_INGEST_KEY" \
        -H 'content-type: application/json' \
        -d "$(jq -nc --arg u "$ARTIFACT_URL" --arg r "$(Build.Repository.Name)" --arg c "$(Build.SourceVersion)" \
               '{url:$u, repo:$r, commit:$c}')")
      echo "$RESP"
      echo "$RESP" | jq -e '.buildId' >/dev/null
    displayName: Send the build to fabMem
    env:
      FABMEM_URL: $(FABMEM_URL)
      FABMEM_INGEST_KEY: $(FABMEM_INGEST_KEY)
      FABMEM_SPHERE: $(FABMEM_SPHERE)
      ARTIFACT_URL: $(ARTIFACT_URL)
