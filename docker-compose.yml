# fabMem enterprise — self-hosted stack.
#
#   cp .env.example .env && $EDITOR .env
#   docker login <registry>          # credentials issued with your licence
#   docker compose up -d
#
# ONE container. It hosts its own PostgreSQL 17 (with pgvector + pg_textsearch already provisioned) inside the
# image, storing the database on the `fabmem-data` volume. There is no database service to run, no password to
# set, and no managed-Postgres extension problem to work around.
#
# To use an EXTERNAL Postgres instead, set DATABASE_URL — the server then leaves its own database unstarted. That
# server must carry BOTH `vector` and `pg_textsearch`, or every keyword/BM25 lane silently returns nothing.

services:
  app:
    image: ${FABMEM_IMAGE:?set FABMEM_IMAGE in .env to a pinned tag}
    restart: unless-stopped
    environment:
      # Unset = host our own Postgres on the volume below (the supported default).
      DATABASE_URL: ${DATABASE_URL:-}

      PORT: "8080"
      DATA_DIR: /data

      # CI credential for POST /ingest/build. A bootstrap value: once the dashboard has issued API keys, those
      # are per-caller, revocable, and stored as scrypt hashes — prefer them and keep this only for first setup.
      FABMEM_INGEST_TOKEN: ${FABMEM_INGEST_TOKEN:?set FABMEM_INGEST_TOKEN in .env (openssl rand -hex 32)}

      # Fallback for /mcp and the dashboard, used ONLY while WORKOS_ISSUER is unset.
      FABMEM_QUERY_TOKEN: ${FABMEM_QUERY_TOKEN:?set FABMEM_QUERY_TOKEN in .env (openssl rand -hex 32)}

      # SSO. Setting WORKOS_ISSUER switches /mcp and the dashboard to WorkOS AuthKit.
      WORKOS_ISSUER: ${WORKOS_ISSUER:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_ALLOWED_DOMAINS: ${WORKOS_ALLOWED_DOMAINS:-}
      WORKOS_ALLOWED_ORG_ID: ${WORKOS_ALLOWED_ORG_ID:-}
      FABMEM_MCP_RESOURCE_URL: ${FABMEM_MCP_RESOURCE_URL:-}

      # Optional LLM enrichment (doc2query). Indexing, embeddings and every search lane work WITHOUT these —
      # embeddings are a local model, and no query path calls an LLM. Set them only to enable the summarizer.
      FABMEM_SUMMARIZE: ${FABMEM_SUMMARIZE:-}
      AZURE_OPENAI_CLASSIFICATION_ENDPOINT: ${AZURE_OPENAI_CLASSIFICATION_ENDPOINT:-}
      AZURE_OPENAI_CLASSIFICATION_KEY: ${AZURE_OPENAI_CLASSIFICATION_KEY:-}
      AZURE_OPENAI_CLASSIFICATION_DEPLOYMENT: ${AZURE_OPENAI_CLASSIFICATION_DEPLOYMENT:-}
      AZURE_OPENAI_CLASSIFICATION_API_VERSION: ${AZURE_OPENAI_CLASSIFICATION_API_VERSION:-}
    ports:
      - "${FABMEM_HOST_PORT:-8080}:8080"
    volumes:
      # HOME is /data inside the image, so this ONE volume holds the database (.fabmem/pgdata), the extracted
      # source snapshots, the indexer cache and the embedding model. Losing it loses the index.
      - ${FABMEM_DATA_PATH:-fabmem-data}:/data
    healthcheck:
      # /ready, not /health: /health only proves the process is up. /ready answers 503 until the extensions,
      # schema, storage and model all check out, so a misconfiguration shows as an UNHEALTHY container.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  fabmem-data:
